version: 2

seeds:
  - name: senior_mens_international_leagues
    description: Canonical senior men's international league allowlist shared with Python ingestion.
    columns:
      - name: league_id
        tests:
          - unique
          - not_null
      - name: league_name
        tests:
          - not_null

  - name: fifa_mens_world_ranking_december_2022
    description: FIFA men's world ranking seed used as the initial national-team Elo baseline.
    columns:
      - name: Rank
        tests:
          - unique
          - not_null
      - name: Team
        tests:
          - unique
          - not_null
      - name: Raiting
        tests:
          - not_null

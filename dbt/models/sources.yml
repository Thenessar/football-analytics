version: 2

sources:
  - name: bronze
    catalog: "{{ var('catalog', env_var('DBT_FOOTBALL_CATALOG', 'football_analytics')) }}"
    schema: "{{ var('bronze_schema', env_var('DBT_FOOTBALL_BRONZE_SCHEMA', 'bronze')) }}"
    description: Raw API-Football payloads owned by Python ingestion.
    tables:
      - name: football_fixtures_raw
        description: Raw `/fixtures` response envelopes persisted as JSON strings.
      - name: football_match_raw
        description: Raw `/fixtures/players` response envelopes persisted as JSON strings.
      - name: football_lineups_raw
        description: Raw `/fixtures/lineups` response envelopes persisted as JSON strings.
      - name: football_fixture_statistics_raw
        description: Raw `/fixtures/statistics` response envelopes persisted as JSON strings.

  - name: gold_predictions
    catalog: "{{ var('catalog', env_var('DBT_FOOTBALL_CATALOG', 'football_analytics')) }}"
    schema: "{{ var('gold_schema', env_var('DBT_FOOTBALL_GOLD_SCHEMA', 'gold')) }}"
    description: Prediction tables owned by the Python pre-match inference job.
    tables:
      - name: pred_football__player_event_predictions
        description: >
          Stored pre-match player event predictions (business_logic.md §15).
          Grain: one row per fixture_id/team_id/player_id/target_event/
          model_name/model_version/prediction_set_id. Written by
          football_analytics/inference.py with the append + is_active_prediction
          strategy (§15.4 Option C).
        columns:
          - name: fixture_id
            tests:
              - not_null
          - name: player_id
            tests:
              - not_null
          - name: target_event
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - offsides
                      - shots_total
                      - shots_on
                      - goals_total
                      - goals_assists
                      - goals_saves
                      - passes_total
                      - fouls_drawn
                      - fouls_committed
                      - cards_yellow
                      - cards_red
          - name: position_group
            tests:
              - accepted_values:
                  arguments:
                    values: ['G', 'D', 'M', 'F']
          - name: is_starting
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [true, false]
                    quote: false
          - name: is_active_prediction
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [true, false]
                    quote: false
          - name: lineup_source
            tests:
              - accepted_values:
                  arguments:
                    values: ['confirmed_api', 'projected', 'offline_sample']

      - name: sim_football__fixture_simulation
        description: >
          Monte Carlo fixture simulation summaries (ml_upgrade_backlog.md N4,
          ADR 0005). Grain: one row per fixture_id/sim_set_id/entity_type/
          entity_id/target_event; entity_type is player, team, or fixture
          (the fixture row carries the scoreline matrix JSON). Written by
          football_analytics/simulation.py with the shared append +
          is_active_simulation strategy.
        columns:
          - name: fixture_id
            tests:
              - not_null
          - name: sim_set_id
            tests:
              - not_null
          - name: entity_type
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['player', 'team', 'fixture']
          - name: target_event
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - offsides
                      - shots_total
                      - shots_on
                      - goals_total
                      - goals_assists
                      - goals_saves
                      - passes_total
                      - fouls_drawn
                      - fouls_committed
                      - cards_yellow
                      - cards_red
                      - scoreline
          - name: is_active_simulation
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [true, false]
                    quote: false

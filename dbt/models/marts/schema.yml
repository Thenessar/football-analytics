version: 2

models:
  - name: fct_football__team_match_context
    description: Gold team-fixture context table with one row per team per fixture.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - team_id
    columns:
      - name: fixture_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football__fixtures')
                field: fixture_id
      - name: team_id
        tests:
          - not_null
      - name: opponent_team_id
        tests:
          - not_null
      - name: home_away
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: team_formation
        description: The formation used by the team in the fixture.
      - name: opponent_formation
        description: The formation used by the opponent in the fixture.

  - name: fct_football__team_match_stats_context
    description: >
      Gold team match-flow context with one row per fixture/team. Joins silver
      team match statistics onto the team-perspective fixture context
      (opponent, home/away, competition) and adds leakage-safe rolling features
      over the five fixtures strictly prior to the current one. Current-match
      stat columns are outcomes (null for future fixtures) and must not be used
      as predictors; the rolling *_l5 features and expected_possession_share
      are pre-match safe. expected_possession_share is engineered as the team's
      rolling possession share against the opponent's rolling possession, with
      a 0.5 fallback when either side lacks history. Fouls drawn by a team
      equal the fouls its opponent commits, so opponent_fouls_drawn_allowed_l5
      is the opponent's own committed-fouls rolling average.
    columns:
      - name: fixture_id
        description: API-Football fixture identifier.
      - name: team_id
        description: Team identifier for the row perspective.
      - name: team_possession_l5_avg
        description: Team average possession over the previous 5 fixtures (excluding the current one).
      - name: opponent_possession_l5_avg
        description: Opponent average possession over its previous 5 fixtures (excluding the current one).
      - name: expected_possession_share
        description: Pre-match possession share estimate in [0, 1]; 0.5 when history is insufficient.
      - name: team_passes_l5_per_match
        description: Team average passes per match over the previous 5 fixtures.
      - name: opponent_passes_allowed_l5
        description: Passes the opponent allowed per match over its previous 5 fixtures.
      - name: team_shots_l5
        description: Team average shots per match over the previous 5 fixtures.
      - name: opponent_shots_allowed_l5
        description: Shots the opponent allowed per match over its previous 5 fixtures.
      - name: team_fouls_l5
        description: Team average fouls committed per match over the previous 5 fixtures.
      - name: opponent_fouls_drawn_allowed_l5
        description: Fouls the opponent commits per match over its previous 5 fixtures (fouls available to be drawn against it).
      - name: elo_expected_score
        description: Elo win expectancy from pre-match general Elo, 1/(1+10^((opp-team)/400)); see docs/adr/0001-expected-possession-approach.md.
      - name: elo_possession_interaction
        description: elo_expected_score multiplied by expected_possession_share (ADR 0001 engineered-feature decision).
      - name: formation_possession_profile
        description: Team average possession over its last 10 fixtures with the same formation; null when the formation has no history.

  - name: fct_football__player_match_features
    description: Canonical gold player-fixture feature mart for data science. One row represents one player for one team in one fixture, with player statistics, match context, lineup context, engineered per-90 metrics, rate metrics, and modeling flags.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - team_id
              - player_id
    columns:
      - name: fixture_id
        description: API-Football fixture identifier.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football__player_match_stats')
                field: fixture_id
      - name: team_id
        description: API-Football team identifier for the player's team in the fixture.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football__player_match_stats')
                field: team_id
      - name: player_id
        description: API-Football player identifier.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football__player_match_stats')
                field: player_id
      - name: fixture_date_utc
        description: Fixture kickoff timestamp in UTC.
      - name: league_id
        description: API-Football league identifier.
      - name: league_name
        description: League name from the fixture context.
      - name: league_season
        description: League season from the fixture context.
      - name: status_short
        description: Provider fixture status code.
      - name: home_away
        description: Whether the player's team was home or away.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: team_name
        description: Team name from the player statistics payload.
      - name: opponent_team_id
        description: API-Football identifier for the opposing team.
        tests:
          - not_null
      - name: opponent_team_name
        description: Opposing team name from the fixture context.
      - name: goals_for
        description: Goals scored by the player's team in the fixture.
      - name: goals_against
        description: Goals conceded by the player's team in the fixture.
      - name: opponent_formation
        description: The formation used by the opposing team.
      - name: player_name
        description: Player display name from the provider payload.
      - name: games_position
        description: Position reported in the player statistics payload.
      - name: lineup_position
        description: Position reported in the lineup payload.
      - name: primary_position
        description: Preferred position for modeling, using lineup position when present and falling back to the statistics position.
      - name: position_group
        description: Standardized modeling position group.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['G', 'D', 'M', 'F']
      - name: is_starting
        description: Raw lineup flag indicating whether the player was in the starting XI when lineup data is available.
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: is_starter
        description: Modeling flag for starting players, derived from lineup data and falling back to the provider substitute flag.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: was_substitute
        description: Modeling flag for substitute appearances, derived from player statistics and lineup data.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: is_captain
        description: Modeling flag indicating whether the player was marked as captain.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: is_goalkeeper
        description: Modeling flag derived from the standardized position group.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: formation
        description: Team formation reported in the lineup payload.
      - name: formation_grid
        description: Player grid location inside the reported formation.
      - name: formation_row
        description: Numeric row parsed from formation_grid.
      - name: formation_column
        description: Numeric column parsed from formation_grid.
      - name: games_minutes
        description: Minutes played by the player in the fixture.
        tests:
          - not_null
      - name: games_rating
        description: Provider player rating cast to a numeric value.
      - name: shots_total
        description: Provider total shots.
        tests:
          - not_null
      - name: shots_on
        description: Provider shots on target.
        tests:
          - not_null
      - name: goals_total
        description: Provider goals scored.
        tests:
          - not_null
      - name: goals_assists
        description: Provider assists.
        tests:
          - not_null
      - name: goals_conceded
        description: Provider goals conceded, primarily relevant for goalkeepers.
      - name: goals_saves
        description: Provider saves, primarily relevant for goalkeepers.
      - name: passes_total
        description: Provider total passes.
      - name: passes_key
        description: Provider key passes.
      - name: passes_accuracy
        description: Provider `passes.accuracy` value cast from the raw string payload. API-Football reports this as completed passes even though the source field is named accuracy.
      - name: tackles_total
        description: Provider total tackles.
      - name: tackles_blocks
        description: Provider blocked shots.
      - name: tackles_interceptions
        description: Provider interceptions.
        tests:
          - not_null
      - name: duels_total
        description: Provider total duels.
      - name: duels_won
        description: Provider duels won.
      - name: dribbles_attempts
        description: Provider dribble attempts.
        tests:
          - not_null
      - name: dribbles_success
        description: Provider successful dribbles.
      - name: dribbles_past
        description: Provider times dribbled past.
      - name: fouls_drawn
        description: Provider fouls drawn.
      - name: fouls_committed
        description: Provider fouls committed.
        tests:
          - not_null
      - name: cards_yellow
        description: Provider yellow cards.
      - name: cards_red
        description: Provider red cards.
      - name: penalty_won
        description: Provider penalties won.
      - name: penalty_committed
        description: Provider penalties committed; sourced from API-Football's `commited` field.
      - name: penalty_scored
        description: Provider penalties scored.
      - name: penalty_missed
        description: Provider penalties missed.
      - name: penalty_saved
        description: Provider penalties saved.
      - name: shots_per_90
        description: Total shots scaled to a 90-minute rate.
        tests:
          - not_null
      - name: shots_on_per_90
        description: Shots on target scaled to a 90-minute rate.
        tests:
          - not_null
      - name: goals_per_90
        description: Goals scaled to a 90-minute rate.
        tests:
          - not_null
      - name: assists_per_90
        description: Assists scaled to a 90-minute rate.
        tests:
          - not_null
      - name: passes_per_90
        description: Total passes scaled to a 90-minute rate.
        tests:
          - not_null
      - name: key_passes_per_90
        description: Key passes scaled to a 90-minute rate.
        tests:
          - not_null
      - name: tackles_per_90
        description: Total tackles scaled to a 90-minute rate.
        tests:
          - not_null
      - name: interceptions_per_90
        description: Interceptions scaled to a 90-minute rate.
        tests:
          - not_null
      - name: duels_per_90
        description: Total duels scaled to a 90-minute rate.
        tests:
          - not_null
      - name: dribbles_attempted_per_90
        description: Dribble attempts scaled to a 90-minute rate.
        tests:
          - not_null
      - name: fouls_committed_per_90
        description: Fouls committed scaled to a 90-minute rate.
        tests:
          - not_null
      - name: saves_per_90
        description: Goalkeeper saves scaled to a 90-minute rate.
        tests:
          - not_null
      - name: shots_on_target_rate
        description: Share of total shots that were on target, zero when the player had no shots.
        tests:
          - not_null
      - name: pass_accuracy_pct
        description: Completed pass percentage calculated as provider `passes_accuracy` divided by total passes and multiplied by 100.
        tests:
          - not_null
      - name: duels_won_rate
        description: Share of total duels won, zero when the player had no duels.
        tests:
          - not_null
      - name: dribble_success_rate
        description: Share of attempted dribbles completed, zero when the player attempted no dribbles.
        tests:
          - not_null
      - name: game_importance_scalar
        description: Context scalar available for weighted modeling.
      - name: opponent_strength_adjustment
        description: Context scalar for opponent strength adjustment.
      - name: defensive_containment_rating
        description: Context defensive containment rating for the opponent matchup.
      - name: defensive_elo
        description: Context defensive Elo-like baseline for the opponent matchup.

  - name: fct_football__team_elo_history
    description: Chronological point-in-time team Elo history. One row represents one team in one fixture; `_pre` values are emitted before the match update and `_post` values are the state carried into the next fixture.
    config:
      tags:
        - python
      submission_method: serverless_cluster
      environment_key: dbt_python_serverless
      environment_dependencies:
        - "{{ env_var('DBT_WORKSPACE_ROOT_PATH', '') }}/artifacts/.internal/football_analytics-0.1.0-py3-none-any.whl"
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - team_id
    columns:
      - name: fixture_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football__fixtures')
                field: fixture_id
      - name: team_id
        tests:
          - not_null
      - name: opponent_team_id
        tests:
          - not_null
      - name: team_elo_attack_pre
        tests:
          - not_null
      - name: team_elo_defense_pre
        tests:
          - not_null
      - name: opponent_elo_attack_pre
        tests:
          - not_null
      - name: opponent_elo_defense_pre
        tests:
          - not_null
      - name: team_elo_attack_post
        tests:
          - not_null
      - name: team_elo_defense_post
        tests:
          - not_null

  - name: fct_football__player_elo_history
    description: Chronological player Elo history with player modifiers anchored to the current national-team attack and defense baseline.
    config:
      tags:
        - python
      submission_method: serverless_cluster
      environment_key: dbt_python_serverless
      environment_dependencies:
        - "{{ env_var('DBT_WORKSPACE_ROOT_PATH', '') }}/artifacts/.internal/football_analytics-0.1.0-py3-none-any.whl"
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - team_id
              - player_id
    columns:
      - name: fixture_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football__fixtures')
                field: fixture_id
      - name: team_id
        tests:
          - not_null
      - name: player_id
        tests:
          - not_null
      - name: games_minutes
        tests:
          - not_null
      - name: player_offensive_elo_pre
        tests:
          - not_null
      - name: player_defensive_elo_pre
        tests:
          - not_null
      - name: player_offensive_modifier_pre
        tests:
          - not_null
      - name: player_defensive_modifier_pre
        tests:
          - not_null
      - name: missed_fixture_count_pre
        tests:
          - not_null

  - name: fct_football__lineup_elo_strength
    description: Confirmed starting XI Elo strength. Bench players are excluded; only complete 11-player starting lineups are materialized.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - team_id
    columns:
      - name: fixture_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football__fixtures')
                field: fixture_id
      - name: team_id
        tests:
          - not_null
      - name: starting_xi_attack_elo
        tests:
          - not_null
      - name: starting_xi_defense_elo
        tests:
          - not_null
      - name: starting_xi_player_count
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [11]
                quote: false

  - name: dim_football__rating_baseline
    description: Gold model-ready FIFA ranking baseline with normalized team names.
    columns:
      - name: rank
        tests:
          - unique
          - not_null
      - name: team_name
        tests:
          - not_null
      - name: rating
        tests:
          - not_null
      - name: ranking_as_of_date
        tests:
          - not_null

  - name: fct_football__player_shot_features
    description: Specialized gold player prop modeling mart with structural-zero count labels, exposure, and strictly lagged rolling form features for Poisson-LightGBM workflows.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - team_id
              - player_id
    columns:
      - name: fixture_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football__player_match_stats')
                field: fixture_id
      - name: player_id
        tests:
          - not_null
      - name: games_minutes
        tests:
          - not_null
      - name: exposure
        tests:
          - not_null
      - name: shots_total
        tests:
          - not_null
      - name: shots_on
        tests:
          - not_null
      - name: dribbles_attempts
        tests:
          - not_null
      - name: fouls_committed
        tests:
          - not_null
      - name: offsides
        tests:
          - not_null
      - name: tackles_interceptions
        tests:
          - not_null
      - name: shots_total_l5_p90
        tests:
          - not_null
      - name: dribbles_attempts_l5_p90
        tests:
          - not_null
      - name: fouls_committed_l5_p90
        tests:
          - not_null
      - name: shots_per_90
        tests:
          - not_null
      - name: shots_on_per_90
        tests:
          - not_null
      - name: team_elo_attack_pre
        tests:
          - not_null
      - name: opponent_elo_defense_pre
        tests:
          - not_null
      - name: player_offensive_elo_pre
        tests:
          - not_null
      - name: player_defensive_elo_pre
        tests:
          - not_null
      - name: team_lineup_attack_strength
        tests:
          - not_null
      - name: team_lineup_defense_strength
        tests:
          - not_null
      - name: opponent_formation
        description: The formation used by the opposing team.
      - name: formation_win_rate_pre
        description: Historical win rate of the team's formation prior to the match.
      - name: formation_count_pre
        description: Number of preceding matches played using the team's formation.
      - name: formation_matchup_win_rate_pre
        description: Head-to-head win rate of the team's formation against the opponent's formation in preceding matches.
      - name: formation_matchup_count_pre
        description: Number of preceding head-to-head matches between these two formations.

  - name: fct_football__player_sapm
    description: Specialized gold S-APM-ready mart rebuilt from fct_football__player_match_features with position priors and context weights.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - team_id
              - player_id
    columns:
      - name: fixture_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football__player_match_stats')
                field: fixture_id
      - name: player_id
        tests:
          - not_null
      - name: position_group
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['F', 'M', 'D', 'G']
      - name: shot_rate_smoothed_per_minute
        tests:
          - not_null
      - name: sapm_interaction_weight
        tests:
          - not_null

  - name: fct_football__formation_matchup_history
    description: Cumulative point-in-time overall and head-to-head success statistics for formations.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - team_id
    columns:
      - name: fixture_id
        tests:
          - not_null
      - name: team_id
        tests:
          - not_null
      - name: formation_win_rate_pre
        tests:
          - not_null
      - name: formation_count_pre
        tests:
          - not_null
      - name: formation_matchup_win_rate_pre
        tests:
          - not_null
      - name: formation_matchup_count_pre
        tests:
          - not_null

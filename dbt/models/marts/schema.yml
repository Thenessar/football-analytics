version: 2

models:
  - name: fct_football__team_match_context
    description: Gold team-fixture context table with one row per team per fixture.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - team_id
    columns:
      - name: fixture_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football__fixtures')
                field: fixture_id
      - name: team_id
        tests:
          - not_null
      - name: opponent_team_id
        tests:
          - not_null
      - name: home_away
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: team_formation
        description: The formation used by the team in the fixture.
      - name: opponent_formation
        description: The formation used by the opponent in the fixture.

  - name: fct_football__team_match_stats_context
    description: >
      Gold team match-flow context with one row per fixture/team. Joins silver
      team match statistics onto the team-perspective fixture context
      (opponent, home/away, competition) and adds leakage-safe rolling features
      over the five fixtures strictly prior to the current one. Current-match
      stat columns are outcomes (null for future fixtures) and must not be used
      as predictors; the rolling *_l5 features and expected_possession_share
      are pre-match safe. expected_possession_share is engineered as the team's
      rolling possession share against the opponent's rolling possession, with
      a 0.5 fallback when either side lacks history. Fouls drawn by a team
      equal the fouls its opponent commits, so opponent_fouls_drawn_allowed_l5
      is the opponent's own committed-fouls rolling average.
      Null handling: rolling *_l5 columns are null only when a team has no
      prior fixture with statistics coverage (early history); they are
      otherwise populated even for future fixtures.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - team_id
    columns:
      - name: fixture_id
        description: API-Football fixture identifier.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football__fixtures')
                field: fixture_id
      - name: team_id
        description: Team identifier for the row perspective.
        tests:
          - not_null
      - name: opponent_team_id
        tests:
          - not_null
      - name: home_away
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: team_possession_l5_avg
        description: Team average possession over the previous 5 fixtures (excluding the current one).
      - name: opponent_possession_l5_avg
        description: Opponent average possession over its previous 5 fixtures (excluding the current one).
      - name: expected_possession_share
        description: Pre-match possession share estimate in [0, 1]; 0.5 when history is insufficient.
      - name: team_passes_l5_per_match
        description: Team average passes per match over the previous 5 fixtures.
      - name: opponent_passes_allowed_l5
        description: Passes the opponent allowed per match over its previous 5 fixtures.
      - name: team_shots_l5
        description: Team average shots per match over the previous 5 fixtures.
      - name: opponent_shots_allowed_l5
        description: Shots the opponent allowed per match over its previous 5 fixtures.
      - name: team_fouls_l5
        description: Team average fouls committed per match over the previous 5 fixtures.
      - name: opponent_fouls_drawn_allowed_l5
        description: Fouls the opponent commits per match over its previous 5 fixtures (fouls available to be drawn against it).
      - name: elo_expected_score
        description: Elo win expectancy from pre-match general Elo, 1/(1+10^((opp-team)/400)); see docs/adr/0001-expected-possession-approach.md.
      - name: elo_possession_interaction
        description: elo_expected_score multiplied by expected_possession_share (ADR 0001 engineered-feature decision).
      - name: formation_possession_profile
        description: Team average possession over its last 10 fixtures with the same formation; null when the formation has no history.

  - name: mon_football__prediction_vs_actual
    description: >
      Row-level actual-vs-predicted view joining active player event
      predictions to the realized labels of completed fixtures. Groundwork for
      the Â§16.3 monitoring list; feeds mon_football__prediction_monitoring.

  - name: mon_football__prediction_monitoring
    description: >
      Aggregated monitoring view (one row per target_event / position_group /
      league / model version segment): prediction counts, MAE, bias,
      predicted-vs-empirical P(>=1) and P(>=2) calibration for sparse events,
      and the segment's date range. Dashboarding on top is a follow-up; this
      view is the queryable check required by backlog I2.

  - name: mon_football__simulation_vs_actual
    description: >
      Active player-level simulation rows joined to realized labels after
      completion: bias, MAE, 5-95% interval hit rate, and P(>=1) calibration
      inputs per league_season / target_event / position_group /
      engine_version. Feeds the ADR 0005 revisit triggers.

  - name: mon_football__prediction_calibration
    description: >
      Production calibration curves: predicted P(>=1)/P(>=2) versus empirical
      frequency in 0.1 probability bins, per target_event / position_group /
      model_version. Live counterpart of the training reliability artifacts.

  - name: mon_football__prediction_ranking
    description: >
      Within-fixture ranking quality on live predictions: top-1 leader hit
      rate per target_event / model_version / league. Team-fixtures with no
      occurrences of the event are excluded from the rate and counted
      separately.

  - name: mon_football__expected_minutes_accuracy
    description: >
      Expected-minutes estimator accuracy over completed fixtures (one row
      per league_season / is_starting / expected_minutes_method /
      position_group segment): MAE, bias, average expected vs actual minutes,
      and p_plays-vs-actual participation calibration for bench players.
      Gate for the ADR 0004 deferred ML minutes model (>=10% relative MAE
      improvement required).

  - name: mon_football__prediction_coverage
    description: >
      Per-fixture operational coverage: confirmed starters, starters with an
      active prediction, starter prediction coverage rate, count of starters
      missing expected minutes, and the active set's lineup source. Fixtures
      without predictions surface with zero coverage.

  - name: mon_football__inference_feature_health
    description: >
      Inference feature-health monitor (prediction_quality_backlog FA-103):
      one row per upcoming fixture/team/monitored feature over non-completed
      feature-mart rows. Reports null rate and within-team distinct-value
      count for the player-differentiating families (player-Elo
      modifiers/elo/rating, *_l5_p90 rolling rates, appearances_l5_count)
      plus played-history freshness. Guards the E-2 serving-skew class where
      every player of a team collapses to the same feature values.
      Empty-but-queryable before any upcoming fixture lands.
    columns:
      - name: feature_name
        description: Feature-mart column this row reports on.
      - name: lineup_row_count
        description: Inference rows for the fixture/team (confirmed lineup size).
      - name: null_count
        description: Inference rows where the feature is null.
      - name: null_rate
        description: Share of inference rows where the feature is null.
      - name: distinct_value_count
        description: count(distinct feature) within the team's inference rows; nulls do not count, so all-null yields 0.
      - name: is_flagged_constant
        description: >
          True when lineup_row_count >= 11 and distinct_value_count <= 1 —
          a full lineup whose differentiating feature is all-null or
          all-constant. Sparse *_l5_p90 events can flag legitimately on quiet
          teams; the hard failing assertion on modifiers is the FA-101 data
          test assert_fct_football__player_event_features_inference_elo_differentiated.
      - name: team_history_max_fixture_date_utc
        description: Newest played appearance for this team in fct_football__player_match_features.
      - name: history_max_fixture_date_utc
        description: Newest played appearance in fct_football__player_match_features overall.
      - name: history_staleness_hours
        description: Hours between current_timestamp() and history_max_fixture_date_utc.

  - name: fct_football__player_event_features
    description: >
      General player-event feature mart (one row per fixture/team/player)
      serving training and inference; design and column inventory in
      docs/design/player_event_features_schema.md. Completed fixtures carry
      the 11 target-event labels; future fixtures with confirmed lineups carry
      null labels and expected_minutes/expected_exposure for inference. All
      predictors are pre-match safe: Elo columns are _pre variants and the
      *_l5_count/_l5_p90 player history features come from the last 5 played
      appearances strictly prior to the fixture (ranked join, never the
      current fixture). Replaced the former fct_football__player_shot_features
      mart (removed in backlog J1) as the canonical training source.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - team_id
              - player_id
    columns:
      - name: fixture_id
        tests:
          - not_null
      - name: team_id
        tests:
          - not_null
      - name: player_id
        tests:
          - not_null
      - name: is_completed_fixture
        description: True for completed fixtures (labels populated, training rows); false for inference rows with null labels.
        tests:
          - not_null
      - name: position_group
        tests:
          - accepted_values:
              arguments:
                values: ['G', 'D', 'M', 'F']
      - name: exposure
        description: games_minutes / 90 for training rows; null on inference rows (use expected_exposure there).
      - name: expected_exposure
        description: expected_minutes / 90; populated whenever the player has an expected-minutes row.
      - name: p_plays
        description: Probability the player gets on the pitch (ADR 0004 decomposition); 1.0 for confirmed starters. Consumed by the simulation layer.
      - name: expected_minutes_if_plays
        description: Expected minutes conditional on playing (ADR 0004 decomposition). Consumed by the simulation layer.

  - name: fct_football__player_expected_minutes
    description: >
      Role-conditional pre-match expected minutes for players named in a
      fixture lineup (starters and substitutes), one row per
      fixture/team/player: expected_minutes = p_plays *
      expected_minutes_if_plays, conditioned on the player's role in TODAY'S
      confirmed lineup. Starters draw on their last 5 prior starts; bench
      players on their last 10 prior bench namings (unused-sub namings count
      as 0-minute observations). All history is strictly prior to the
      fixture, so the value is computable at inference time before kickoff.
      Estimator rationale and prior provenance are recorded in
      docs/adr/0004-expected-minutes-role-conditional.md (supersedes ADR
      0002).
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - team_id
              - player_id
    columns:
      - name: fixture_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football__fixtures')
                field: fixture_id
      - name: team_id
        tests:
          - not_null
      - name: player_id
        tests:
          - not_null
      - name: is_starting
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: position_group
        tests:
          - accepted_values:
              arguments:
                values: ['G', 'D', 'M', 'F']
      - name: expected_minutes
        description: Expected minutes for the fixture (p_plays * expected_minutes_if_plays), clamped to [0, 120].
        tests:
          - not_null
      - name: p_plays
        description: Probability the player gets on the pitch. Always 1.0 for confirmed starters; shrunk empirical bench-participation rate for bench players.
        tests:
          - not_null
      - name: expected_minutes_if_plays
        description: Expected minutes conditional on playing, from role-matched history shrunk toward the role prior, clamped to [0, 120]. The simulation layer consumes this together with p_plays.
        tests:
          - not_null
      - name: expected_minutes_method
        description: "Which estimator branch produced the value: starter_l5_trimmed_shrunk (>=3 prior starts), starter_low_history_shrunk (1-2), starter_prior (0), bench_l10_shrunk (>=3 prior bench namings), bench_low_history_shrunk (1-2), bench_prior (0)."
        tests:
          - accepted_values:
              arguments:
                values: ['starter_l5_trimmed_shrunk', 'starter_low_history_shrunk', 'starter_prior', 'bench_l10_shrunk', 'bench_low_history_shrunk', 'bench_prior']
      - name: prior_appearance_count
        description: History depth backing the active branch (prior starts for starters, prior bench namings for bench players).
      - name: starts_in_history_count
        description: Prior starts available to the estimator (max 5).
      - name: bench_namings_in_history_count
        description: Prior bench namings available to the estimator (max 10), including unused-sub namings.

  - name: fct_football__player_match_features
    description: Canonical gold player-fixture feature mart for data science. One row represents one player for one team in one fixture, with player statistics, match context, lineup context, engineered per-90 metrics, rate metrics, and modeling flags.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - team_id
              - player_id
    columns:
      - name: fixture_id
        description: API-Football fixture identifier.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football__player_match_stats')
                field: fixture_id
      - name: team_id
        description: API-Football team identifier for the player's team in the fixture.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football__player_match_stats')
                field: team_id
      - name: player_id
        description: API-Football player identifier.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football__player_match_stats')
                field: player_id
      - name: fixture_date_utc
        description: Fixture kickoff timestamp in UTC.
      - name: league_id
        description: API-Football league identifier.
      - name: league_name
        description: League name from the fixture context.
      - name: league_season
        description: League season from the fixture context.
      - name: status_short
        description: Provider fixture status code.
      - name: home_away
        description: Whether the player's team was home or away.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: team_name
        description: Team name from the player statistics payload.
      - name: opponent_team_id
        description: API-Football identifier for the opposing team.
        tests:
          - not_null
      - name: opponent_team_name
        description: Opposing team name from the fixture context.
      - name: goals_for
        description: Goals scored by the player's team in the fixture.
      - name: goals_against
        description: Goals conceded by the player's team in the fixture.
      - name: opponent_formation
        description: The formation used by the opposing team.
      - name: player_name
        description: Player display name from the provider payload.
      - name: games_position
        description: Position reported in the player statistics payload.
      - name: lineup_position
        description: Position reported in the lineup payload.
      - name: primary_position
        description: Preferred position for modeling, using lineup position when present and falling back to the statistics position.
      - name: position_group
        description: Standardized modeling position group.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['G', 'D', 'M', 'F']
      - name: is_starting
        description: Raw lineup flag indicating whether the player was in the starting XI when lineup data is available.
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: is_starter
        description: Modeling flag for starting players, derived from lineup data and falling back to the provider substitute flag.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: was_substitute
        description: Modeling flag for substitute appearances, derived from player statistics and lineup data.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: is_captain
        description: Modeling flag indicating whether the player was marked as captain.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: is_goalkeeper
        description: Modeling flag derived from the standardized position group.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: formation
        description: Team formation reported in the lineup payload.
      - name: formation_grid
        description: Player grid location inside the reported formation.
      - name: formation_row
        description: Numeric row parsed from formation_grid.
      - name: formation_column
        description: Numeric column parsed from formation_grid.
      - name: games_minutes
        description: Minutes played by the player in the fixture.
        tests:
          - not_null
      - name: games_rating
        description: Provider player rating cast to a numeric value.
      - name: shots_total
        description: Provider total shots.
        tests:
          - not_null
      - name: shots_on
        description: Provider shots on target.
        tests:
          - not_null
      - name: goals_total
        description: Provider goals scored.
        tests:
          - not_null
      - name: goals_assists
        description: Provider assists.
        tests:
          - not_null
      - name: goals_conceded
        description: Provider goals conceded, primarily relevant for goalkeepers.
      - name: goals_saves
        description: Provider saves, primarily relevant for goalkeepers.
      - name: passes_total
        description: Provider total passes.
      - name: passes_key
        description: Provider key passes.
      - name: passes_accuracy
        description: Provider `passes.accuracy` value cast from the raw string payload. API-Football reports this as completed passes even though the source field is named accuracy.
      - name: tackles_total
        description: Provider total tackles.
      - name: tackles_blocks
        description: Provider blocked shots.
      - name: tackles_interceptions
        description: Provider interceptions.
        tests:
          - not_null
      - name: duels_total
        description: Provider total duels.
      - name: duels_won
        description: Provider duels won.
      - name: dribbles_attempts
        description: Provider dribble attempts.
        tests:
          - not_null
      - name: dribbles_success
        description: Provider successful dribbles.
      - name: dribbles_past
        description: Provider times dribbled past.
      - name: fouls_drawn
        description: Provider fouls drawn.
      - name: fouls_committed
        description: Provider fouls committed.
        tests:
          - not_null
      - name: cards_yellow
        description: Provider yellow cards.
      - name: cards_red
        description: Provider red cards.
      - name: penalty_won
        description: Provider penalties won.
      - name: penalty_committed
        description: Provider penalties committed; sourced from API-Football's `commited` field.
      - name: penalty_scored
        description: Provider penalties scored.
      - name: penalty_missed
        description: Provider penalties missed.
      - name: penalty_saved
        description: Provider penalties saved.
      - name: shots_per_90
        description: Total shots scaled to a 90-minute rate.
        tests:
          - not_null
      - name: shots_on_per_90
        description: Shots on target scaled to a 90-minute rate.
        tests:
          - not_null
      - name: goals_per_90
        description: Goals scaled to a 90-minute rate.
        tests:
          - not_null
      - name: assists_per_90
        description: Assists scaled to a 90-minute rate.
        tests:
          - not_null
      - name: passes_per_90
        description: Total passes scaled to a 90-minute rate.
        tests:
          - not_null
      - name: key_passes_per_90
        description: Key passes scaled to a 90-minute rate.
        tests:
          - not_null
      - name: tackles_per_90
        description: Total tackles scaled to a 90-minute rate.
        tests:
          - not_null
      - name: interceptions_per_90
        description: Interceptions scaled to a 90-minute rate.
        tests:
          - not_null
      - name: duels_per_90
        description: Total duels scaled to a 90-minute rate.
        tests:
          - not_null
      - name: dribbles_attempted_per_90
        description: Dribble attempts scaled to a 90-minute rate.
        tests:
          - not_null
      - name: fouls_committed_per_90
        description: Fouls committed scaled to a 90-minute rate.
        tests:
          - not_null
      - name: saves_per_90
        description: Goalkeeper saves scaled to a 90-minute rate.
        tests:
          - not_null
      - name: shots_on_target_rate
        description: Share of total shots that were on target, zero when the player had no shots.
        tests:
          - not_null
      - name: pass_accuracy_pct
        description: Completed pass percentage calculated as provider `passes_accuracy` divided by total passes and multiplied by 100.
        tests:
          - not_null
      - name: duels_won_rate
        description: Share of total duels won, zero when the player had no duels.
        tests:
          - not_null
      - name: dribble_success_rate
        description: Share of attempted dribbles completed, zero when the player attempted no dribbles.
        tests:
          - not_null
      - name: game_importance_scalar
        description: Context scalar available for weighted modeling.
      - name: opponent_strength_adjustment
        description: Context scalar for opponent strength adjustment.
      - name: defensive_containment_rating
        description: Context defensive containment rating for the opponent matchup.
      - name: defensive_elo
        description: Context defensive Elo-like baseline for the opponent matchup.

  - name: fct_football__team_elo_history
    description: Chronological point-in-time team Elo history. One row represents one team in one fixture; `_pre` values are emitted before the match update and `_post` values are the state carried into the next fixture.
    config:
      tags:
        - python
      submission_method: serverless_cluster
      environment_key: dbt_python_serverless
      environment_dependencies:
        - "{{ env_var('DBT_WORKSPACE_ROOT_PATH', '') }}/artifacts/.internal/football_analytics-0.1.0-py3-none-any.whl"
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - team_id
    columns:
      - name: fixture_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football__fixtures')
                field: fixture_id
      - name: team_id
        tests:
          - not_null
      - name: opponent_team_id
        tests:
          - not_null
      - name: team_elo_attack_pre
        tests:
          - not_null
      - name: team_elo_defense_pre
        tests:
          - not_null
      - name: opponent_elo_attack_pre
        tests:
          - not_null
      - name: opponent_elo_defense_pre
        tests:
          - not_null
      - name: team_elo_attack_post
        tests:
          - not_null
      - name: team_elo_defense_post
        tests:
          - not_null

  - name: fct_football__player_elo_history
    description: >
      Chronological player Elo history with player modifiers anchored to the
      current national-team attack and defense baseline. In addition to the
      per-appearance snapshots, one current-state row per (team, player) is
      emitted after the chronological pass (is_current_state = true, null
      fixture_id) carrying the post-history modifiers; inference rows in the
      feature mart join those by player for future fixtures (FA-101).
    config:
      tags:
        - python
      submission_method: serverless_cluster
      environment_key: dbt_python_serverless
      environment_dependencies:
        - "{{ env_var('DBT_WORKSPACE_ROOT_PATH', '') }}/artifacts/.internal/football_analytics-0.1.0-py3-none-any.whl"
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - team_id
              - player_id
    columns:
      - name: fixture_id
        tests:
          - not_null:
              config:
                where: "not is_current_state"
          - relationships:
              arguments:
                to: ref('stg_football__fixtures')
                field: fixture_id
      - name: team_id
        tests:
          - not_null
      - name: player_id
        tests:
          - not_null
      - name: games_minutes
        tests:
          - not_null:
              config:
                where: "not is_current_state"
      - name: player_offensive_elo_pre
        tests:
          - not_null:
              config:
                where: "not is_current_state"
      - name: player_defensive_elo_pre
        tests:
          - not_null:
              config:
                where: "not is_current_state"
      - name: player_offensive_modifier_pre
        tests:
          - not_null
      - name: player_defensive_modifier_pre
        tests:
          - not_null
      - name: missed_fixture_count_pre
        tests:
          - not_null
      - name: is_current_state
        tests:
          - not_null

  - name: fct_football__lineup_elo_strength
    description: Confirmed starting XI Elo strength. Bench players are excluded; only complete 11-player starting lineups are materialized.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fixture_id
              - team_id
    columns:
      - name: fixture_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football__fixtures')
                field: fixture_id
      - name: team_id
        tests:
          - not_null
      - name: starting_xi_attack_elo
        tests:
          - not_null
      - name: starting_xi_defense_elo
        tests:
          - not_null
      - name: starting_xi_player_count
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [11]
                quote: false

  - name: dim_football__rating_baseline
    description: Gold model-ready FIFA ranking baseline with normalized team names.
    columns:
      - name: rank
        tests:
          - unique
          - not_null
      - name: team_name
        tests:
          - not_null
      - name: rating
        tests:
          - not_null
      - name: ranking_as_of_date
        tests:
          - not_null

  - name: fct_football__player_sapm
    description: Specialized gold S-APM-ready mart rebuilt from fct_football__player_match_features with position priors and context weights.

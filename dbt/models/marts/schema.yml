      - name: dribbles_attempts_l5_p90
        tests:
          - not_null
      - name: fouls_committed_l5_p90
        tests:
          - not_null
      - name: shots_per_90
        tests:
          - not_null
      - name: shots_on_per_90
        tests:
          - not_null
      - name: team_elo_attack_pre
        tests:
          - not_null
      - name: opponent_elo_defense_pre
        tests:

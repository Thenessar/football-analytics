version: 2

unit_tests:
  - name: player_event_features_rolling_windows_exclude_current_fixture
    description: >
      Leakage regression (backlog D3): rolling *_l5 features for a fixture
      must never include that fixture's own stats. Player 7 records 2 shots in
      fixtures 1-4 and an extreme 50 shots in fixture 5; fixture 5's rolling
      count must be 8 (2+2+2+2), not 58, and each earlier fixture must only
      see strictly-prior appearances. Fails loudly if the window definition
      ever includes current-match data.
    model: fct_football__player_event_features
    given:
      - input: ref('fct_football__player_match_features')
        rows:
          - {fixture_id: 1, fixture_date_utc: "2026-06-01 18:00:00", team_id: 1, player_id: 7, is_starter: true, position_group: "M", is_goalkeeper: false, games_minutes: 90, shots_total: 2}
          - {fixture_id: 2, fixture_date_utc: "2026-06-05 18:00:00", team_id: 1, player_id: 7, is_starter: true, position_group: "M", is_goalkeeper: false, games_minutes: 90, shots_total: 2}
          - {fixture_id: 3, fixture_date_utc: "2026-06-09 18:00:00", team_id: 1, player_id: 7, is_starter: true, position_group: "M", is_goalkeeper: false, games_minutes: 90, shots_total: 2}
          - {fixture_id: 4, fixture_date_utc: "2026-06-13 18:00:00", team_id: 1, player_id: 7, is_starter: true, position_group: "M", is_goalkeeper: false, games_minutes: 90, shots_total: 2}
          - {fixture_id: 5, fixture_date_utc: "2026-06-17 18:00:00", team_id: 1, player_id: 7, is_starter: true, position_group: "M", is_goalkeeper: false, games_minutes: 90, shots_total: 50}
      - input: ref('stg_football__lineups')
        rows: []
      - input: ref('fct_football__team_match_context')
        rows: []
      - input: ref('fct_football__team_elo_history')
        rows: []
      - input: ref('fct_football__player_elo_history')
        rows: []
      - input: ref('fct_football__lineup_elo_strength')
        rows: []
      - input: ref('fct_football__formation_matchup_history')
        rows: []
      - input: ref('fct_football__team_match_stats_context')
        rows: []
      - input: ref('fct_football__player_expected_minutes')
        rows: []
    expect:
      rows:
        - {fixture_id: 1, player_id: 7, appearances_l5_count: 0, minutes_l5: 0.0, shots_total_l5_count: 0.0, shots_total_l5_p90: 0.0, shots_total: 2.0}
        - {fixture_id: 2, player_id: 7, appearances_l5_count: 1, minutes_l5: 90.0, shots_total_l5_count: 2.0, shots_total_l5_p90: 2.0, shots_total: 2.0}
        - {fixture_id: 3, player_id: 7, appearances_l5_count: 2, minutes_l5: 180.0, shots_total_l5_count: 4.0, shots_total_l5_p90: 2.0, shots_total: 2.0}
        - {fixture_id: 4, player_id: 7, appearances_l5_count: 3, minutes_l5: 270.0, shots_total_l5_count: 6.0, shots_total_l5_p90: 2.0, shots_total: 2.0}
        - {fixture_id: 5, player_id: 7, appearances_l5_count: 4, minutes_l5: 360.0, shots_total_l5_count: 8.0, shots_total_l5_p90: 2.0, shots_total: 50.0}

  - name: player_event_features_eb_rates_shrink_and_exclude_current_fixture
    description: >
      FA-104 empirical-Bayes career rate: with exactly one strictly-prior
      appearance the decay weight is exactly 1.0, so the numbers are
      binary-exact. Fixture 1 (no history, no prior position-group data) must
      yield 0.0 even though the fixture itself has 3 shots (leakage guard on
      the player's own sums). Fixture 2 must yield
      (1.0*3 + 5*prior) / (1.0*1 + 5) with the position-group prior = 3.0
      (cumulative F-group rate strictly before fixture 2's date) = 3.0 — and
      must ignore fixture 2's own 50 shots in both the career sums and the
      prior (leakage guard on the position-group cumulative).
    model: fct_football__player_event_features
    given:
      - input: ref('fct_football__player_match_features')
        rows:
          - {fixture_id: 1, fixture_date_utc: "2026-06-01 18:00:00", team_id: 1, player_id: 7, is_starter: true, position_group: "F", is_goalkeeper: false, games_minutes: 90, shots_total: 3}
          - {fixture_id: 2, fixture_date_utc: "2026-06-05 18:00:00", team_id: 1, player_id: 7, is_starter: true, position_group: "F", is_goalkeeper: false, games_minutes: 90, shots_total: 50}
      - input: ref('stg_football__lineups')
        rows: []
      - input: ref('fct_football__team_match_context')
        rows: []
      - input: ref('fct_football__team_elo_history')
        rows: []
      - input: ref('fct_football__player_elo_history')
        rows: []
      - input: ref('fct_football__lineup_elo_strength')
        rows: []
      - input: ref('fct_football__formation_matchup_history')
        rows: []
      - input: ref('fct_football__team_match_stats_context')
        rows: []
      - input: ref('fct_football__player_expected_minutes')
        rows: []
    expect:
      rows:
        - {fixture_id: 1, player_id: 7, shots_total_eb_p90: 0.0, goals_total_eb_p90: 0.0}
        - {fixture_id: 2, player_id: 7, shots_total_eb_p90: 3.0, goals_total_eb_p90: 0.0}

  - name: player_event_features_inference_rows_use_current_player_elo_state
    description: >
      Serving-skew regression (prediction_quality_backlog FA-101 / E-2):
      inference rows for a future fixture must carry each player's distinct
      current-state modifier (joined by player, not by fixture) and recompute
      player_offensive_elo_pre as the future fixture's team Elo baseline plus
      that modifier — exactly the training-time definition. Completed-fixture
      rows must keep their fixture-exact player-Elo values bit-identical.
      All mocked modifier values are binary-exact so equality is safe.
    model: fct_football__player_event_features
    given:
      - input: ref('fct_football__player_match_features')
        rows:
          - {fixture_id: 1, fixture_date_utc: "2026-06-01 18:00:00", team_id: 1, player_id: 7, player_name: "Star Forward", is_starter: true, position_group: "F", is_goalkeeper: false, games_minutes: 90, shots_total: 4}
          - {fixture_id: 1, fixture_date_utc: "2026-06-01 18:00:00", team_id: 1, player_id: 8, player_name: "Squad Midfielder", is_starter: true, position_group: "M", is_goalkeeper: false, games_minutes: 90, shots_total: 1}
      - input: ref('stg_football__lineups')
        rows:
          - {fixture_id: 2, team_id: 1, player_id: 7, player_name: "Star Forward", is_starting: true, position: "F"}
          - {fixture_id: 2, team_id: 1, player_id: 8, player_name: "Squad Midfielder", is_starting: true, position: "M"}
      - input: ref('fct_football__team_match_context')
        rows:
          - {fixture_id: 2, fixture_date_utc: "2026-06-10 18:00:00", team_id: 1, team_name: "Team A", status_short: "NS", home_away: "home"}
      - input: ref('fct_football__team_elo_history')
        rows:
          - {fixture_id: 1, team_id: 1, team_elo_attack_pre: 0.25, team_elo_defense_pre: 0.125}
          - {fixture_id: 2, team_id: 1, team_elo_attack_pre: 0.25, team_elo_defense_pre: 0.125}
      # Every row must carry the identical key set: dbt renders each row as
      # its own SELECT and UNIONs them, so heterogeneous keys fail with
      # NUM_COLUMNS_MISMATCH on Databricks.
      - input: ref('fct_football__player_elo_history')
        rows:
          - {fixture_id: 1, team_id: 1, player_id: 7, is_current_state: false, player_offensive_modifier_pre: 0.125, player_defensive_modifier_pre: 0.0, player_offensive_elo_pre: 0.375, player_defensive_elo_pre: 0.125, player_offensive_rating_pre: 0.375, player_defensive_rating_pre: 0.125, missed_fixture_count_pre: 0}
          - {fixture_id: 1, team_id: 1, player_id: 8, is_current_state: false, player_offensive_modifier_pre: -0.125, player_defensive_modifier_pre: 0.0, player_offensive_elo_pre: 0.125, player_defensive_elo_pre: 0.125, player_offensive_rating_pre: 0.125, player_defensive_rating_pre: 0.125, missed_fixture_count_pre: 0}
          - {fixture_id: null, team_id: 1, player_id: 7, is_current_state: true, player_offensive_modifier_pre: 0.5, player_defensive_modifier_pre: 0.25, player_offensive_elo_pre: null, player_defensive_elo_pre: null, player_offensive_rating_pre: null, player_defensive_rating_pre: null, missed_fixture_count_pre: 0}
          - {fixture_id: null, team_id: 1, player_id: 8, is_current_state: true, player_offensive_modifier_pre: -0.25, player_defensive_modifier_pre: 0.0, player_offensive_elo_pre: null, player_defensive_elo_pre: null, player_offensive_rating_pre: null, player_defensive_rating_pre: null, missed_fixture_count_pre: 2}
      - input: ref('fct_football__lineup_elo_strength')
        rows: []
      - input: ref('fct_football__formation_matchup_history')
        rows: []
      - input: ref('fct_football__team_match_stats_context')
        rows: []
      - input: ref('fct_football__player_expected_minutes')
        rows: []
    expect:
      rows:
        - {fixture_id: 1, player_id: 7, is_completed_fixture: true, player_offensive_modifier_pre: 0.125, player_offensive_elo_pre: 0.375, player_offensive_rating_pre: 0.375, player_defensive_elo_pre: 0.125, missed_fixture_count_pre: 0}
        - {fixture_id: 1, player_id: 8, is_completed_fixture: true, player_offensive_modifier_pre: -0.125, player_offensive_elo_pre: 0.125, player_offensive_rating_pre: 0.125, player_defensive_elo_pre: 0.125, missed_fixture_count_pre: 0}
        - {fixture_id: 2, player_id: 7, is_completed_fixture: false, player_offensive_modifier_pre: 0.5, player_offensive_elo_pre: 0.75, player_offensive_rating_pre: 0.75, player_defensive_elo_pre: 0.375, missed_fixture_count_pre: 0}
        - {fixture_id: 2, player_id: 8, is_completed_fixture: false, player_offensive_modifier_pre: -0.25, player_offensive_elo_pre: 0.0, player_offensive_rating_pre: 0.0, player_defensive_elo_pre: 0.125, missed_fixture_count_pre: 2}

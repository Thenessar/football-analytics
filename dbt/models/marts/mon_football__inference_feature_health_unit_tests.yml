version: 2

unit_tests:
  - name: inference_feature_health_flags_all_constant_team
    description: >
      FA-103 acceptance: a synthetic upcoming fixture whose full 11-player
      lineup carries an all-constant player_offensive_modifier_pre (the E-2
      serving-skew signature) must be flagged, while a properly
      player-differentiated feature (player_offensive_elo_pre, 11 distinct
      values) must not be. Features that are entirely null count as degenerate
      (distinct_value_count 0, null_rate 1.0). Completed-fixture rows are out
      of scope and must not produce monitor rows.
    model: mon_football__inference_feature_health
    given:
      - input: ref('fct_football__player_event_features')
        rows:
          - {fixture_id: 100, team_id: 1, player_id: 1, is_completed_fixture: false, status_short: "NS", player_offensive_modifier_pre: 0.0, player_offensive_elo_pre: 1.0}
          - {fixture_id: 100, team_id: 1, player_id: 2, is_completed_fixture: false, status_short: "NS", player_offensive_modifier_pre: 0.0, player_offensive_elo_pre: 2.0}
          - {fixture_id: 100, team_id: 1, player_id: 3, is_completed_fixture: false, status_short: "NS", player_offensive_modifier_pre: 0.0, player_offensive_elo_pre: 3.0}
          - {fixture_id: 100, team_id: 1, player_id: 4, is_completed_fixture: false, status_short: "NS", player_offensive_modifier_pre: 0.0, player_offensive_elo_pre: 4.0}
          - {fixture_id: 100, team_id: 1, player_id: 5, is_completed_fixture: false, status_short: "NS", player_offensive_modifier_pre: 0.0, player_offensive_elo_pre: 5.0}
          - {fixture_id: 100, team_id: 1, player_id: 6, is_completed_fixture: false, status_short: "NS", player_offensive_modifier_pre: 0.0, player_offensive_elo_pre: 6.0}
          - {fixture_id: 100, team_id: 1, player_id: 7, is_completed_fixture: false, status_short: "NS", player_offensive_modifier_pre: 0.0, player_offensive_elo_pre: 7.0}
          - {fixture_id: 100, team_id: 1, player_id: 8, is_completed_fixture: false, status_short: "NS", player_offensive_modifier_pre: 0.0, player_offensive_elo_pre: 8.0}
          - {fixture_id: 100, team_id: 1, player_id: 9, is_completed_fixture: false, status_short: "NS", player_offensive_modifier_pre: 0.0, player_offensive_elo_pre: 9.0}
          - {fixture_id: 100, team_id: 1, player_id: 10, is_completed_fixture: false, status_short: "NS", player_offensive_modifier_pre: 0.0, player_offensive_elo_pre: 10.0}
          - {fixture_id: 100, team_id: 1, player_id: 11, is_completed_fixture: false, status_short: "NS", player_offensive_modifier_pre: 0.0, player_offensive_elo_pre: 11.0}
          - {fixture_id: 99, team_id: 2, player_id: 12, is_completed_fixture: true, status_short: "FT", player_offensive_modifier_pre: 0.0, player_offensive_elo_pre: 1.0}
      - input: ref('fct_football__player_match_features')
        rows:
          - {fixture_id: 99, team_id: 1, player_id: 12, fixture_date_utc: "2026-06-01 18:00:00"}
    expect:
      rows:
        - {fixture_id: 100, team_id: 1, feature_name: "player_offensive_modifier_pre", lineup_row_count: 11, null_rate: 0.0, distinct_value_count: 1, is_flagged_constant: true}
        - {fixture_id: 100, team_id: 1, feature_name: "player_defensive_modifier_pre", lineup_row_count: 11, null_rate: 1.0, distinct_value_count: 0, is_flagged_constant: true}
        - {fixture_id: 100, team_id: 1, feature_name: "player_offensive_elo_pre", lineup_row_count: 11, null_rate: 0.0, distinct_value_count: 11, is_flagged_constant: false}
        - {fixture_id: 100, team_id: 1, feature_name: "player_defensive_elo_pre", lineup_row_count: 11, null_rate: 1.0, distinct_value_count: 0, is_flagged_constant: true}
        - {fixture_id: 100, team_id: 1, feature_name: "player_offensive_rating_pre", lineup_row_count: 11, null_rate: 1.0, distinct_value_count: 0, is_flagged_constant: true}
        - {fixture_id: 100, team_id: 1, feature_name: "player_defensive_rating_pre", lineup_row_count: 11, null_rate: 1.0, distinct_value_count: 0, is_flagged_constant: true}
        - {fixture_id: 100, team_id: 1, feature_name: "appearances_l5_count", lineup_row_count: 11, null_rate: 1.0, distinct_value_count: 0, is_flagged_constant: true}
        - {fixture_id: 100, team_id: 1, feature_name: "offsides_l5_p90", lineup_row_count: 11, null_rate: 1.0, distinct_value_count: 0, is_flagged_constant: true}
        - {fixture_id: 100, team_id: 1, feature_name: "shots_total_l5_p90", lineup_row_count: 11, null_rate: 1.0, distinct_value_count: 0, is_flagged_constant: true}
        - {fixture_id: 100, team_id: 1, feature_name: "shots_on_l5_p90", lineup_row_count: 11, null_rate: 1.0, distinct_value_count: 0, is_flagged_constant: true}
        - {fixture_id: 100, team_id: 1, feature_name: "goals_total_l5_p90", lineup_row_count: 11, null_rate: 1.0, distinct_value_count: 0, is_flagged_constant: true}
        - {fixture_id: 100, team_id: 1, feature_name: "goals_assists_l5_p90", lineup_row_count: 11, null_rate: 1.0, distinct_value_count: 0, is_flagged_constant: true}
        - {fixture_id: 100, team_id: 1, feature_name: "goals_saves_l5_p90", lineup_row_count: 11, null_rate: 1.0, distinct_value_count: 0, is_flagged_constant: true}
        - {fixture_id: 100, team_id: 1, feature_name: "passes_total_l5_p90", lineup_row_count: 11, null_rate: 1.0, distinct_value_count: 0, is_flagged_constant: true}
        - {fixture_id: 100, team_id: 1, feature_name: "fouls_drawn_l5_p90", lineup_row_count: 11, null_rate: 1.0, distinct_value_count: 0, is_flagged_constant: true}
        - {fixture_id: 100, team_id: 1, feature_name: "fouls_committed_l5_p90", lineup_row_count: 11, null_rate: 1.0, distinct_value_count: 0, is_flagged_constant: true}
        - {fixture_id: 100, team_id: 1, feature_name: "cards_yellow_l5_p90", lineup_row_count: 11, null_rate: 1.0, distinct_value_count: 0, is_flagged_constant: true}
        - {fixture_id: 100, team_id: 1, feature_name: "cards_red_l5_p90", lineup_row_count: 11, null_rate: 1.0, distinct_value_count: 0, is_flagged_constant: true}
